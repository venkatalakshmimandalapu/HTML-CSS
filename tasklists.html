<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Product Listing</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Our Products</h1>

    <ul class="product-list">
        <li class="product">
           
            <h2>Product 1</h2>
            <p>High-quality product for everyday use.</p>
            <span class="price">$19.99</span>
            <button>Add to Cart</button>
        </li>

        <li class="product">
           
            <h2>Product 2</h2>
            <p>Durable and stylish, perfect for you.</p>
            <span class="price">$24.99</span>
            <button>Add to Cart</button>
        </li>

        <li class="product">
           
            <h2>Product 3</h2>
            <p>Reliable and affordable, best in the market.</p>
            <span class="price">$29.99</span>
            <button>Add to Cart</button>
        </li>
    </ul>

</body>
</html>
