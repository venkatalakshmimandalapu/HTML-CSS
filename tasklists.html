<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing with Navbar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Section -->
    <section class="nav-section">
        <nav class="navbar">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </section>

    <h1>Our Products</h1>

    <ul class="product-list">
        <li class="product">
           
            <h2>Product 1</h2>
            <p>High-quality product for everyday use.</p>
            <span class="price">$19.99</span>
          
        </li>

        <li class="product">
            
            <h2>Product 2</h2>
            <p>Durable and stylish, perfect for you.</p>
            <span class="price">$24.99</span>
            
        </li>

        <li class="product">
            
            <h2>Product 3</h2>
            <p>Reliable and affordable, best in the market.</p>
            <span class="price">$29.99</span>
            
        </li>
    </ul>

</body>
</html>
